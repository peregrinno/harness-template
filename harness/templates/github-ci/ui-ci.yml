name: ui-ci

on:
  push:
    branches: [master, stage, develop, "feature/**"]
  pull_request:
    branches: [develop, stage, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test --coverage --coverageThreshold='{"global":{"lines":60}}'
      - run: yarn test:e2e
        env:
          CI: true
