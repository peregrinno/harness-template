services:
  postgres:
    profiles: ["infra"]
    image: postgres:17
    container_name: harness-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - harness_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["infra"]
    image: redis:7
    container_name: harness-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    profiles: ["infra"]
    image: rabbitmq:3-management
    container_name: harness-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: enable with profile mongo (and infra.mongodb.enabled in project.yaml)
  mongo:
    image: mongo:7
    container_name: harness-mongo
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    volumes:
      - harness_mongo:/data/db

volumes:
  harness_pg:
  harness_mongo:
