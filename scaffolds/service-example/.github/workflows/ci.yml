name: service-ci

on:
  push:
    branches: [master, stage, develop, "feature/**"]
  pull_request:
    branches: [develop, stage, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check && uv run ruff format --check
      - name: Semver
        run: python scripts/check_semver.py
      - name: Pytest with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=60
