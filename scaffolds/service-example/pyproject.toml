[project]
name = "service-example"
version = "0.1.0"
description = "Example hexagonal FastAPI microservice (SQLAlchemy 2 async)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy[asyncio]==2.0.40",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "redis==5.2.1",
    "aio-pika==9.5.5",
    "httpx==0.28.1",
    "loguru==0.7.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.1.1",
    "ruff==0.11.5",
    "pre-commit==4.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/src/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/src/tests/*",
    "app/src/adapters/outbound/db.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
omit = [
    "app/src/tests/*",
    "app/src/adapters/outbound/db.py",
]
