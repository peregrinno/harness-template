repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest --cov=app --cov-fail-under=60
        language: system
        pass_filenames: false
      - id: semver
        name: semver
        entry: python scripts/check_semver.py
        language: system
        pass_filenames: false
